# Every push and pull request runs the tests. A push to main (merging dev) also releases:
# migrate the production database, then deploy the backend (Cloud Run), then the website (Cloudflare).
# Each step waits for the one before, and nothing deploys if a test fails.
name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }} # never cancel a release halfway

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: remotepinas_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGUSER: postgres # the tests connect to localhost/remotepinas_test
      PGPASSWORD: postgres
      JWT_SECRET: ci-only-not-a-real-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  website-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx next typegen # page and layout types Next.js normally makes while the dev server runs
      - run: npx tsc --noEmit
      - run: npm run lint

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-tests, website-checks]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # lets GitHub sign in to Google Cloud without a stored key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 1. Database: apply schema.sql (it only adds what's missing, so it's safe on every release).
      - name: Migrate the production database
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
        run: npm ci && npm run migrate

      # 2. Backend: build the container and roll it out on Cloud Run (settings and secrets stay as they are).
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy the backend
        run: gcloud run deploy remotepinas-api --source backend --region asia-southeast1 --quiet

      # 3. Website: build with frontend/.env.production and deploy the Cloudflare Worker.
      - name: Deploy the website
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm ci && npm run deploy
